<ion-header>
  <ion-toolbar>
    <ion-title>Inicio</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">Salir</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-subtitle>{{ roleLabels[user?.role ?? ''] }}</ion-card-subtitle>
      <ion-card-title>Hola, {{ user?.name }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p><strong>Correo:</strong> {{ user?.email }}</p>
      <p><strong>Teléfono:</strong> {{ user?.phone }}</p>
      <p><strong>Estado:</strong> {{ user?.status }}</p>
    </ion-card-content>
  </ion-card>
</ion-content>
