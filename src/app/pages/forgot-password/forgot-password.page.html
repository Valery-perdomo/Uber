<ion-content class="pastel-bg">
  <div class="screen centered">
    <div class="topbar">
      <a class="icon-btn" routerLink="/login" aria-label="Volver al inicio de sesión">
        <ion-icon name="arrow-back" aria-hidden="true"></ion-icon>
      </a>
    </div>

    <div class="glass sheet appear">
      <div class="lock" aria-hidden="true">
        <ion-icon name="lock-closed-outline"></ion-icon>
      </div>
      <h1 class="grad-text">Nueva contraseña</h1>
      <p class="muted sub">Escribe el correo de tu cuenta y la contraseña que quieres usar.</p>

      <form (ngSubmit)="submit()" novalidate>
        <div class="field" [class.invalid]="errors()['email']">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" [(ngModel)]="email" />
          @if (errors()['email']) { <span class="error">{{ errors()['email'] }}</span> }
        </div>

        <div class="field" [class.invalid]="errors()['new_password']">
          <label for="password">Nueva contraseña</label>
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" [(ngModel)]="password" />
          @if (errors()['new_password']) { <span class="error">{{ errors()['new_password'] }}</span> }
        </div>

        <div class="field" [class.invalid]="errors()['confirm']">
          <label for="confirm">Confirmar contraseña</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Repítela" [(ngModel)]="confirm" />
          @if (errors()['confirm']) { <span class="error">{{ errors()['confirm'] }}</span> }
        </div>

        <button class="btn" type="submit" [disabled]="loading()">
          @if (loading()) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Restablecer contraseña
          }
        </button>
      </form>

      <p class="footer muted">
        ¿La recordaste? <a class="link" routerLink="/login">Inicia sesión</a>
      </p>
    </div>
  </div>
</ion-content>
